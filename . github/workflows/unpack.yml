name: Unpack Viral Radio

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu am găsit niciun fișier ZIP în repository."
            exit 1
          fi

          echo "ZIP găsit: $ZIP"
          unzip -o "$ZIP" -d unpacked

      - name: Move project files to root
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          entries=(unpacked/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          else
            SRC="unpacked"
          fi

          echo "Sursă: $SRC"

          for item in "$SRC"/*; do
            name=$(basename "$item")

            case "$name" in
              .git|.github)
                ;;
              *)
                rm -rf "./$name"
                cp -a "$item" "./$name"
                ;;
            esac
          done

          rm -rf unpacked "$ZIP"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack Viral Radio project"
          git push
