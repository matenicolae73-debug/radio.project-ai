name: Unpack Viral Radio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          set -e

          ZIP="Viral-Radio-REAL-LISTENERS-0-FIXED-v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP not found: $ZIP"
            exit 1
          fi

          rm -rf /tmp/radio
          mkdir -p /tmp/radio

          unzip -o "$ZIP" -d /tmp/radio

          cp -f /tmp/radio/index.html ./index.html

          mkdir -p ./api
          cp -f /tmp/radio/api/listeners.js ./api/listeners.js

          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Deploy real listeners counter"
            git push
          fi
