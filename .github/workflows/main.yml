name: Download and Unpack Viral Radio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu exista niciun ZIP in main!"
            exit 1
          fi

          echo "ZIP gasit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unpack ZIP
        run: |
          set -e

          rm -rf /tmp/radio
          mkdir -p /tmp/radio

          unzip -o "$ZIP" -d /tmp/radio

          echo "=== Continut ZIP ==="
          find /tmp/radio -maxdepth 4 -type f -print

      - name: Copy project to main
        run: |
          set -e

          INDEX=$(find /tmp/radio -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html nu exista!"
            exit 1
          fi

          PROJECT_DIR="${INDEX%/index.html}"

          echo "Proiect gasit in: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -f "$ZIP"

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy Viral Radio from ZIP" || echo "Nimic nou de salvat"
          git push
