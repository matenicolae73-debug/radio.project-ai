name: Unpack Viral Radio

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Viral-Radio-GITHUB-READY.zip
        shell: bash
        run: |
          set -e

          ZIP="./Viral-Radio-GITHUB-READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Nu am găsit $ZIP"
            exit 1
          fi

          rm -rf unpacked
          mkdir -p unpacked

          unzip -o "$ZIP" -d unpacked

      - name: Move project files to root
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          entries=(unpacked/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          else
            SRC="unpacked"
          fi

          echo "Project source: $SRC"

          for item in "$SRC"/*; do
            name=$(basename "$item")

            case "$name" in
              .git|.github)
                ;;
              *)
                rm -rf "./$name"
                cp -a "$item" "./$name"
                ;;
            esac
          done

          rm -rf unpacked
          rm -f "$ZIP"

      - name: Check package.json
        shell: bash
        run: |
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json nu există în root."
            echo "Structura proiectului nu este corectă."
            exit 1
          fi

          echo "OK: package.json găsit."
          ls -la

      - name: Commit and push
        shell: bash
        run: |
         
