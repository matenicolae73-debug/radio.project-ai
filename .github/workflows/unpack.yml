name: Unpack Viral Radio

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu exista niciun ZIP in root."
            exit 1
          fi

          echo "ZIP gasit: $ZIP"

          mkdir -p /tmp/radio
          unzip -o "$ZIP" -d /tmp/radio

          rm -rf ./app ./api ./components ./lib ./public 2>/dev/null || true

          if [ -f "/tmp/radio/package.json" ]; then
            cp -R /tmp/radio/. .
          else
            DIR=$(find /tmp/radio -name package.json -type f -print -quit | xargs dirname)
            cp -R "$DIR"/. .
          fi

          rm -f "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack Viral Radio" || echo "Nothing to commit"
          git push
