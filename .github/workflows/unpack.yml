name: Unpack Viral Radio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu există ZIP."
            exit 1
          fi

          echo "ZIP găsit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract
        run: |
          set -e

          rm -rf unpacked
          mkdir unpacked

          unzip -o "$ZIP" -d unpacked

          echo "=== FIȘIERE ==="
          find unpacked -type f

      - name: Put website in root
        run: |
          set -e

          HTML=$(find unpacked -type f -name "index.html" -print -quit)

          if [ -z "$HTML" ]; then
            echo "ERROR: index.html nu a fost găsit."
            exit 1
          fi

          echo "index.html găsit: $HTML"

          cp "$HTML" ./index.html

          rm -rf unpacked
          rm -f "$ZIP"

      - name: Verify
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          if [ ! -f index.html ]; then
            echo "ERROR: index.html lipsește."
            exit 1
          fi

          echo "SUCCESS: Viral Radio este în root."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack Viral Radio website"
          git push
