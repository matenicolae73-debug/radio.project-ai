name: Unpack Viral Radio

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          set -e

          ZIP="Viral-Radio-CASTERFM-REAL-LISTENERS-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP-ul nu exista!"
            ls -la
            exit 1
          fi

          rm -rf /tmp/radio
          mkdir -p /tmp/radio

          unzip -o "$ZIP" -d /tmp/radio

          echo "=== CONTINUT ZIP ==="
          find /tmp/radio -maxdepth 4 -type f -print

          PROJECT_DIR=$(find /tmp/radio -type f -name "index.html" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: index.html nu a fost gasit!"
            exit 1
          fi

          echo "=== PROIECT GASIT ==="
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -f "$ZIP"

          echo "=== PROIECT IN ROOT ==="
          ls -la

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Unpack Viral Radio CasterFM" || echo "Nothing to commit"
          git push
