name: Unpack Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu există niciun ZIP în repository."
            exit 1
          fi

          echo "ZIP găsit: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf unpacked
          mkdir unpacked

          unzip -o "$ZIP" -d unpacked

      - name: Move project to root
        shell: bash
        run: |
          set -e
          shopt -s dotglob nullglob

          entries=(unpacked/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          else
            SRC="unpacked"
          fi

          echo "Project: $SRC"

          for item in "$SRC"/*; do
            name=$(basename "$item")

            case "$name" in
              .git|.github)
                ;;
              *)
                rm -rf "./$name"
                cp -a "$item" "./$name"
                ;;
            esac
          done

          rm -rf unpacked
          rm -f "$ZIP"

      - name: Verify
        shell: bash
        run: |
          echo "=== PROJECT ROOT ==="
          ls -la

          if [ ! -f package.json ]; then
            echo "ERROR: package.json nu a fost găsit."
            exit 1
          fi

          echo "SUCCESS: package.json găsit."

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack project"
          git push
