name: Unpack Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          echo "=== ZIP-URI GĂSITE ==="
          find . -type f -iname "*.zip" -not -path "./.git/*" -print

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu există niciun ZIP în GitHub."
            exit 1
          fi

          echo "ZIP ales: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf unpacked
          mkdir unpacked

          unzip -q -o "$ZIP" -d unpacked

          echo "=== CONȚINUT ==="
          find unpacked -maxdepth 4 -type f | head -100

      - name: Find package.json
        run: |
          set -e

          PACKAGE=$(find unpacked -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json NU există în ZIP."
            echo "Structura ZIP-ului este:"
            find unpacked -maxdepth 5 -print
            exit 1
          fi

          echo "package.json găsit:"
          echo "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Copy project to root
        run: |
          set -e

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          shopt -s dotglob nullglob

          for item in "$PROJECT_DIR"/*; do
            name=$(basename "$item")

            if [ "$name" != ".git" ]; then
              rm -rf "./$name"
              cp -a "$item" "./$name"
            fi
          done

          rm -rf unpacked
          rm -f "$ZIP"

      - name: Verify
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          if [ ! -f package.json ]; then
            echo "ERROR: package.json nu este în root."
            exit 1
          fi

          echo "SUCCESS!"
          echo "package.json este în root."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu există modificări."
            exit 0
          fi

          git commit -m "Unpack Viral Radio project"
          git push
