name: Unpack Viral Radio

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          set -e

          echo "=== ZIP-uri disponibile ==="
          find . -maxdepth 1 -type f -name "*.zip" -print

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Nu exista ZIP!"
            exit 1
          fi

          echo "ZIP gasit: $ZIP"

          rm -rf /tmp/radio
          mkdir -p /tmp/radio

          unzip -o "$ZIP" -d /tmp/radio

          echo "=== CAUT index.html ==="

          INDEX=$(find /tmp/radio -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html nu a fost gasit!"
            find /tmp/radio -type f -print
            exit 1
          fi

          echo "index.html gasit:"
          echo "$INDEX"

          PROJECT_DIR="${INDEX%/index.html}"

          echo "Folder proiect:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -f "$ZIP"

          echo "=== PROIECT DEZARHIVAT ==="
          ls -la

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Unpack Viral Radio" || echo "Nothing to commit"
          git push
